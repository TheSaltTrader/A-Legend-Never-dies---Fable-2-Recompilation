# Community game patches, as midasm hooks - TITLE UPDATE 1 addresses.
#
# The disc build's file is config/hooks/patches_disc.toml; this one is for the
# executable with the disc's title update applied (version 0.0.1.26, branch
# tu1 - see docs/TU1_PORT.md). Three addresses come from Xenia Canary's own
# file for this exact version ("4D5307F1 - Fable II (GOTY_Platinum Edition,
# TU1).patch.toml", by illusion/Margen67/Guy); the rest were relocated from
# the disc addresses with tools/relocate.py, which matches the instruction
# window around a disc address against the patched image with branch and
# address fields masked. EVERY ADDRESS WAS THEN READ BACK FROM THE PATCHED
# IMAGE; the disassembly is in the comments. Same rule as before: a patch
# file for "Fable II" is not a patch file for this executable until the bytes
# at the address say so.

# --- 60 FPS ------------------------------------------------------------------
# Disc: hooked after `li r11, 2` in a 3/2/1 frame-divider selector at
# 0x82B9C8E8. That selector still exists in TU1, moved to 0x82BA3058
# (relocate.py: 36/36 words), and is hooked the same way. TU1 ALSO loads the
# divider from a field, and Canary's TU1 patch targets that load instead:
#
#   Xenia (TU1): [[patch.be32]] address = 0x82ba3018  value = 0x39600001
#
#   0x82BA3014  stw r3, 0x30(r31)
#   0x82BA3018  lwz r11, 0x351C(r31)     <- the divider, read from an object
#   0x82BA301C  cmplwi cr6, r11, 0
#   0x82BA3020  beq cr6, +0x40
#
#   0x82BA3050  li r11, 3   ; b +0x18
#   0x82BA3058  li r11, 2   ; b +0x10     <- 2 = 30 fps
#   0x82BA3060  li r11, 1   ; b +0x08     <- 1 = 60 fps
#
# Both sites are hooked and r11 forced to 1, so the answer is 60 whichever
# path the game takes.
[[midasm_hook]]
address = 0x82BA3018
name = "fable2PatchFrameRateLoad"
registers = ["r11"]
after_instruction = true

[[midasm_hook]]
address = 0x82BA3058
name = "fable2PatchFrameRate"
registers = ["r11"]
after_instruction = true

# --- 1280x720 ----------------------------------------------------------------
# Xenia (TU1): [[patch.be16]] address = 0x823894c2  value = 0x0500
#
#   0x823894B8  cmpwi cr6, r11, 0
#   0x823894BC  stw r10, 0x98(r31)
#   0x823894C0  li r11, 0x460      ; 1120  <- widescreen width
#   0x823894C4  bne cr6, +8
#   0x823894C8  li r11, 0x3c0      ; 960
#
# Same shape as the disc's 0x8238DF58 (relocate.py 36/39).
[[midasm_hook]]
address = 0x823894C0
name = "fable2PatchRenderWidth"
registers = ["r11"]
after_instruction = true

# --- Disable MSAA ------------------------------------------------------------
# Xenia (TU1): [[patch.be8]] address = 0x823894a7  value = 0x01
#
#   0x823894A0  lis r11, 0x8336
#   0x823894A4  li r9, 2          <- sample count
#   0x823894A8  addi r10, r11, 0x320
[[midasm_hook]]
address = 0x823894A4
name = "fable2PatchMsaa"
registers = ["r9"]
after_instruction = true

# --- Disable Texture Morphing (Guy) ------------------------------------------
# Not in Canary's TU1 file. Relocated from the disc's 0x8220EF0C (36/36):
#
#   0x8220EDD0  b +0xCC
#   0x8220EDD4  cmplwi cr6, r18, 0
#   0x8220EDD8  beq cr6, +0x17C          (0x419A017C - the same word as the disc)
#
# Hooked BEFORE the compare, r18 forced to 0 so the existing `beq` is taken.
# Kept as the cheap fallback; the readback setting is the real fix.
[[midasm_hook]]
address = 0x8220EDD4
name = "fable2PatchTextureMorph"
registers = ["r18"]
after_instruction = false

# --- High Tick Rate (Guy) ----------------------------------------------------
# Not in Canary's TU1 file. Found by the constant it writes: the .data double
# 15.0 sits at 0x83319660 in the patched image (the disc's was 0x83319510),
# and the one `stfd f0, -0x69A0(r8)` in .text is at 0x8231091C, preceded by
# the same `lfd f0, 0x68(r1)` as the disc's site:
#
#   0x82310918  lfd  f0, 0x68(r1)
#   0x8231091C  stfd f0, -0x69A0(r8)     <- r8 = 0x83320000 -> 0x83319660
#
# Hooked after the store; the hook writes 30.0 over what it just wrote. The
# hook derives the address from r8 with the displacement in patch_hooks.cpp,
# which is now -0x69A0.
[[midasm_hook]]
address = 0x8231091C
name = "fable2PatchTickRate"
registers = ["r8"]
after_instruction = true

# --- Skip the boot logos -----------------------------------------------------
# Not a community patch. sub_822F4E48 builds the boot movie list on the stack
# ("GAME:\data\art\videos\microsoft_logo.bik", "...\lionhead_logo.bik", end
# marker) and plays entries until one IS the end marker; sub_8229B1B8 answers
# "this entry is not the end marker" (a byte compare against the empty string
# at 0x82000CA0). Read back from the patched image:
#
#   0x822F4EA8  bl   sub_8229B1B8         <- first entry vs the end marker
#   0x822F4EAC  clrlwi r9, r3, 24         <- hooked BEFORE: r3 forced to 0
#   0x822F4EB0  cmplwi cr6, r9, 0
#   0x822F4EB4  beq  cr6, 0x822F50A8      <- the game's own empty-list path
#
# With r3 = 0 the game takes the path it has for an empty list: no player
# object is made, nothing is opened, start-up continues as it does after the
# logos. Why a hook and not the files or the pad: a video that fails to open
# stops the game ("bad disc"), and the auto-skip's button presses never
# shortened the logos (17.1 s with and without them, 2026-09-12).
[[midasm_hook]]
address = 0x822F4EAC
name = "fable2PatchSkipBootLogos"
registers = ["r3"]
after_instruction = false

# --- Yield in the GPU progress poll -----------------------------------------
# Not a community patch. The profiler (FABLE2_PROFILE=1, Bowerstone Market,
# 2026-09-12) put 60% of the "3D Engine" thread inside sub_82BA1FA8, the
# game's "is the GPU still making progress" poll, whose only pause is this
# delay loop before it reads the GPU's pointer:
#
#   0x82BA1FB8  li r11, 4
#   0x82BA1FC4  mr r31, r31   x8            <- eight no-ops
#   0x82BA1FE4  addic. r11, r11, -1          <- hooked BEFORE
#   0x82BA1FE8  bne 0x82BA1FC4
#   0x82BA1FF0  lbz r11, 0x2ABD(r29) ...     <- then the real check
#
# The caller loops on this function while the GPU finishes the frame, so
# the thread burned a whole core to wait. The hook gives the core away for
# one scheduler slice per iteration; the function's own 5000-tick timeout
# measures wall time, so a slower spin changes nothing it decides.
[[midasm_hook]]
address = 0x82BA1FE4
name = "fable2PatchGpuWaitYield"
registers = ["r11"]
after_instruction = false

# --- Sound-bank load sleep -----------------------------------------------------
# Not a community patch. After the logos the game shows a blank frame for
# ~12 s while its "Front end audio loading" thread loads 29 sound banks;
# each read takes a millisecond and is followed by a 400 ms sleep
# (FABLE2_PROFILE=all, 2026-09-12: that thread 99.6% in sub_82CC8880 ->
# XThread::Delay). sub_82CC8880 is the game's Sleep(ms, alertable):
#
#   0x82CC8880  mflr r12 ... stwu r1, -0x70(r1)
#   0x82CC8894  mr r31, r4
#   0x82CC8898  cmpwi cr6, r3, -1          <- hooked BEFORE: r3 = milliseconds
#   0x82CC88A0  clrldi r11, r3, 32 ; mulli r11, r11, -10000  (100 ns units)
#
# The hook shortens a 400 ms sleep to 1 ms on threads whose name says they
# load audio, and logs every other sleep of 100 ms or more once per
# (thread, duration), so the next such wait names itself in the log.
[[midasm_hook]]
address = 0x82CC8898
name = "fable2PatchBankLoadSleep"
registers = ["r3"]
after_instruction = false

# --- Field of view -----------------------------------------------------------
# Not a community patch: ours (2026-09-13). The only perspective builder in the
# game is sub_821B4B48 (found with a hardware write-breakpoint on the live
# projection matrix: its m11 is written from sub_8219D690, the 4x4 constructor,
# whose one tan-using caller is this function). It blends two angles - the
# camera's target field of view at +520/+524 and the previous one at +648/+652,
# horizontal then vertical, radians - halves them, calls the tan routine
# 0x82294118 for each and hands 1/tan to the constructor. Read back from the
# image:
#
#   0x821B4B80  fmadds f8,f12,f1,f0     <- f8  = horizontal FOV (lerped)
#   0x821B4B84  fmadds f30,f9,f1,f11    <- f30 = vertical FOV (lerped)
#   0x821B4B88  fmul   f7,f8,f31        <- hooked BEFORE: both angles rescaled
#   0x821B4B8C  frsp   f1,f7
#   0x821B4B90  bl     0x82294118       <- tan(horizontal / 2)
#   ...
#   0x821B4BD4  fdivs  f1,f31,f9        <- m00 = 1 / tan
#   0x821B4C10  fdivs  f6,f31,f6        <- m11 = 1 / tan
#   0x821B4C20  bl     0x8219d690       <- matrix constructor
#
# The stock vertical angle is 1.0444 rad (59.8 deg); the horizontal one is
# derived from it and the 16:9 aspect (91.3 deg). The hook scales the vertical
# angle by the player's setting over 60 and re-derives the horizontal one from
# the same tan ratio, so the aspect is untouched. It runs every frame (the
# matrix is rebuilt every frame), so the slider is live. Why not the constant
# at 0x82101034 that 0.1.6 wrote: a proper A/B (frames at 60 and 90) showed
# it never reached the camera. r31 is the camera object (`mr r31,r3` at
# entry): its near/far planes at +512/+516 tell the world camera (far 5000)
# from the small far-60 scene built beside it every frame, and a camera at
# fy = 2*atan(3/4) on an object other than the world camera's is the loading
# map (the world camera itself takes that angle for a treasure) (0.1.16).
[[midasm_hook]]
address = 0x821B4B88
name = "fable2PatchFieldOfView"
registers = ["f8", "f30", "r31"]
after_instruction = false
