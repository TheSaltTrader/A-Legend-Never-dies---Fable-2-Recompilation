# Generated by ReXGlue v0.10.0, then edited by hand.

[project]
name = "fable2"
sdk_version = "0.10.0"
game_root = "assets"

[entrypoint]
file_path = "assets/default.xex"
out_directory_path = "generated/default"
includes = [
  "config/functions.toml",
]

# setjmp/longjmp. The recompiler has to model these specially: a longjmp must
# transfer control rather than return, and each recompiled function keeps state
# a naive translation would never unwind. Leaving them unset is quiet and
# catastrophic - on Ninja Gaiden II it turned "abort this resource load" into
# "return normally with invalid state", which overran a stack buffer and
# crashed minutes later on a garbage pointer, nowhere near the cause.
#
# Located by tools/find_setjmp.py and verified as exact mirrors of each other:
#
#   0x83000200  _setjmp(buf)   checks the setjmp hook at [0x83321A8C], then
#                              mflr/mfcr, saves f14-f31, r13-r31 and the
#                              VMX128 non-volatiles into buf, stores LR at
#                              +0x134, CR at +0x130, r1 at +0x90, clears the
#                              flag at +0x138, and returns 0 (0x830004C8).
#                              It has NO .pdata entry of its own - it sits
#                              inside the range starting 0x82FFFF68 - which is
#                              exactly why it has to be named here.
#   0x82CA9260  longjmp(buf, value)  reads the +0x138 flag, pulls the saved LR
#                              from +0x134 and SP from +0x90, then restores the
#                              same register set out of buf.
setjmp_address = 0x83000200
longjmp_address = 0x82CA9260

# Codegen flags carried over from ng2recomp, where each one was load-bearing.
# Defaults keep every guest register in one shared PPCContext, so correctness
# depends on each callee's prologue/epilogue saving and restoring non-volatiles
# through guest stack memory; promoting them to function locals gives each
# recompiled function its own copies and lets the recompiler elide the
# __savegprlr/__restgprlr helper calls.
skip_lr = true
ctr_as_local = true
xer_as_local = true
cr_as_local = true
reserved_as_local = true
non_volatile_as_local = true
